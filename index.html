<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nabua Internship Management System</title>
<style>
:root{--bg:#f6f7f4;--card:rgba(255,255,255,.94);--tx:#1d2a22;--mu:#5d6b62;--ac:#1f6f4a;--ac2:#e3f1ea;--bd:#d9dfd9;--bad:#b3261e;--warn:#9a6a00;--overlay:rgba(246,247,244,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#151a17;--card:rgba(30,37,33,.94);--tx:#e8eee9;--mu:#9aa89f;--ac:#5cc794;--ac2:#223a2f;--bd:#333d37;--bad:#f2b8b5;--warn:#f0c36a;--overlay:rgba(21,26,23,.48)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(var(--overlay),var(--overlay)),url("/Nabua_munisipyo.JPG") center/cover fixed no-repeat;color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 16px 12px;max-width:900px;margin:auto;text-align:center}
h1{font-size:20px;margin:0}.sub,.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;max-width:900px;margin:auto;padding:0 16px;overflow-x:auto}
nav button{background:none;border:1px solid var(--bd);color:var(--tx);padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.btn{background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:8px;cursor:pointer;font:inherit;margin-top:14px}
.btn.s{padding:5px 10px;margin:0;font-size:13px}
.btn.o{background:none;color:var(--tx);border:1px solid var(--bd)}
.btn.r{background:var(--bad);color:#fff}
.tag{display:inline-block;padding:2px 9px;border-radius:10px;font-size:12px;background:var(--ac2);color:var(--ac)}
.tag.Pending{color:var(--warn)}.tag.Rejected{color:var(--bad)}
.ok{background:var(--ac2);padding:10px;border-radius:8px;margin-top:10px}
.msg{color:var(--bad);margin-top:10px;font-size:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stats div{flex:1;min-width:90px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;text-align:center}
.stats b{font-size:22px;display:block}
.login{max-width:400px;margin:30px auto}
.auth{text-align:center;background:rgba(31,111,74,.88);color:#fff}
.auth .mu,.auth label{color:#e7f2eb}
.auth input{text-align:center;background:rgba(255,255,255,.92)}
.auth .btn{background:#154c35}
.auth a{color:#c8f0d7}
.auth .msg{color:#fff;background:rgba(145,26,26,.84);padding:8px;border-radius:6px}
a{color:var(--ac)}
</style>
</head>
<body>
<header>
  <h1>🏛️ Municipal Office of Nabua — Internship Program</h1>
  <div class="sub">Nabua, Camarines Sur · Student internship applications &amp; management</div>
</header>
<nav id="nav"></nav>
<main id="app"></main>

<script>
const OFFICES = [
 {id:"mdrrmo", n:"MDRRMO", f:"Municipal Disaster Risk Reduction & Management Office", d:"Disaster preparedness, emergency response, hazard mapping and community drills.", s:4},
 {id:"agri", n:"Municipal Agriculture Office", f:"Agriculture", d:"Farmer support, crop programs, livestock services and data encoding.", s:4},
 {id:"mcr", n:"Civil Registrar Office", f:"Municipal Civil Registrar", d:"Birth, marriage and death records, document filing and digitization.", s:3},
 {id:"mswdo", n:"MSWDO", f:"Municipal Social Welfare & Development Office", d:"Social programs, community outreach, case documentation and assistance.", s:4},
 {id:"mho", n:"Municipal Health Office", f:"Health", d:"Health programs, patient records, immunization drives and health education.", s:5},
 {id:"meemo", n:"Economic Enterprises & Market Office", f:"Economic Enterprises and Market", d:"Public market operations, stall records, collections and business support.", s:3}
];
const STATUSES = ["Pending","Under Review","Approved","Rejected"];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const oname = id => (OFFICES.find(o => o.id === id) || {}).n || id;

async function api(url, method = "GET", body) {
  const r = await fetch(url, {
    method, headers: {"Content-Type": "application/json"},
    body: body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Request failed");
  return d;
}

let me = null, apps = [], slots = {}, tab = "", mode = "login", msg = "", okmsg = "";
let last = null, pre = "", filter = {o:"", s:""};

async function init() { try { me = await api("/api/me"); } catch (e) {} await go(""); }

async function go(t) {
  tab = t; msg = ""; okmsg = ""; last = null;
  if (me) {
    try { apps = await api("/api/applications"); slots = await api("/api/slots"); }
    catch (e) { me = null; }
  }
  render();
}

/* ---------- auth ---------- */
function setMode(m) { mode = m; msg = ""; render(); }

async function login() {
  try {
    me = await api("/api/login", "POST", {username: $("#u").value, password: $("#p").value});
    await go("");
  } catch (e) { msg = e.message; render(); }
}
async function register() {
  try {
    me = await api("/api/register", "POST", {name: $("#rn").value, username: $("#u").value, password: $("#p").value});
    await go("");
  } catch (e) { msg = e.message; render(); }
}
async function logout() { await api("/api/logout", "POST"); me = null; apps = []; mode = "login"; msg = ""; render(); }

function authView() {
  const reg = mode === "register";
  return `<div class="card login auth">
    <h3>${reg ? "Create student account" : "Log in"}</h3>
    <p class="mu">${reg ? "Register to apply for an internship." : "Please log in to continue."}</p>
    ${reg ? `<label>Full name<input id="rn"></label>` : ""}
    <label>Username<input id="u" autocomplete="username"></label>
    <label>Password<input id="p" type="password" onkeydown="if(event.key==='Enter')${reg ? "register()" : "login()"}"></label>
    ${msg ? `<div class="msg">${esc(msg)}</div>` : ""}
    <button class="btn" onclick="${reg ? "register()" : "login()"}">${reg ? "Register" : "Log in"}</button>
    <p class="mu">${reg
      ? `Already have an account? <a href="#" onclick="setMode('login');return false">Log in</a>`
      : `No account yet? <a href="#" onclick="setMode('register');return false">Register as student</a>`}</p>
  </div>`;
}

/* ---------- render ---------- */
function render() {
  if (!me) { $("#nav").innerHTML = ""; $("#app").innerHTML = authView(); return; }
  const t = me.role === "admin"
    ? [["admin","Admin Dashboard"],["offices","Offices"],["settings","Settings"]]
    : [["offices","Offices"],["apply","Apply"],["track","My Applications"]];
  if (!t.some(x => x[0] === tab)) tab = t[0][0];
  $("#nav").innerHTML = t.map(x => `<button class="${tab === x[0] ? "on" : ""}" onclick="go('${x[0]}')">${x[1]}</button>`).join("")
    + `<button class="o" onclick="logout()">Log out (${esc(me.username)})</button>`;
  $("#app").innerHTML = ({admin:adminView, offices:officesView, settings:settingsView, apply:applyView, track:trackView})[tab]();
}

/* ---------- offices ---------- */
function officesView() {
  return `<p class="mu">Open to students in need of on-the-job training. Choose an office and apply.</p><div class="grid">` +
    OFFICES.map(o => `<div class="card"><h3>${o.n}</h3>
      <div class="mu">${o.f} · ${slots[o.id] || 0}/${o.s} slots filled</div><p>${o.d}</p>
      ${me.role === "student" ? `<button class="btn s" onclick="pre='${o.id}';go('apply')">Apply here</button>` : ""}</div>`).join("") + `</div>`;
}

/* ---------- student: apply ---------- */
function applyView() {
  if (last) return `<div class="card"><h3>✅ Application submitted</h3>
    <p>Your reference number is <b>${esc(last)}</b>. Track it under “My Applications”.</p></div>`;
  const op = OFFICES.map(o => `<option value="${o.id}" ${o.id === pre ? "selected" : ""}>${o.n}</option>`).join("");
  return `<div class="card"><h3>Internship Application Form</h3>
    <label>Full name<input id="f_name" value="${esc(me.name)}"></label>
    <div class="row"><label>Email<input id="f_email" type="email"></label><label>Mobile number<input id="f_phone"></label></div>
    <label>School / University<input id="f_school"></label>
    <div class="row"><label>Course / Program<input id="f_course"></label>
      <label>Year level<select id="f_year"><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Graduating</option></select></label></div>
    <div class="row"><label>First choice office<select id="f_office">${op}</select></label>
      <label>Second choice (optional)<select id="f_office2"><option value="">None</option>${op}</select></label></div>
    <div class="row"><label>Required hours<input id="f_hours" type="number" value="240" min="1"></label>
      <label>Preferred start date<input id="f_start" type="date"></label></div>
    <label>Skills &amp; why you want to intern here<textarea id="f_msg" rows="4"></textarea></label>
    ${msg ? `<div class="msg">${esc(msg)}</div>` : ""}
    <button class="btn" onclick="submitApp()">Submit application</button></div>`;
}

async function submitApp() {
  const g = k => $("#f_" + k).value;
  try {
    const r = await api("/api/applications", "POST", {
      name:g("name"), email:g("email"), phone:g("phone"), school:g("school"), course:g("course"),
      year:g("year"), office:g("office"), office2:g("office2"), hours:g("hours"), start:g("start"), msg:g("msg")
    });
    apps = await api("/api/applications"); last = r.id; msg = "";
  } catch (e) { msg = e.message; }
  render();
}

/* ---------- student: track ---------- */
function trackView() {
  if (!apps.length) return `<div class="card mu">You have no applications yet.</div>`;
  return apps.map(a => `<div class="card"><h3>${esc(oname(a.office))}</h3>
    <div class="mu">Ref ${esc(a.id)} · ${new Date(a.at).toLocaleDateString()}</div>
    <p><span class="tag ${a.status}">${a.status}</span></p>
    ${a.note ? `<div class="ok">Office note: ${esc(a.note)}</div>` : ""}</div>`).join("");
}

/* ---------- admin ---------- */
function adminView() {
  const c = s => apps.filter(a => a.status === s).length;
  const list = apps.filter(a => (!filter.o || a.office === filter.o) && (!filter.s || a.status === filter.s));
  return `<div class="stats"><div><b>${apps.length}</b>Total</div>${STATUSES.map(s => `<div><b>${c(s)}</b>${s}</div>`).join("")}</div>
    <div class="row">
      <select onchange="filter.o=this.value;render()"><option value="">All offices</option>${OFFICES.map(o => `<option value="${o.id}" ${filter.o === o.id ? "selected" : ""}>${o.n}</option>`).join("")}</select>
      <select onchange="filter.s=this.value;render()"><option value="">All statuses</option>${STATUSES.map(s => `<option ${filter.s === s ? "selected" : ""}>${s}</option>`).join("")}</select>
    </div><br>` +
    (list.map(a => `<div class="card"><h3>${esc(a.name)} <span class="tag ${a.status}">${a.status}</span></h3>
      <div class="mu">${esc(a.course)}, ${esc(a.year)} · ${esc(a.school)}<br>${esc(a.email)} · ${esc(a.phone)}</div>
      <p><b>${esc(oname(a.office))}</b>${a.office2 ? ` <span class="mu">(2nd: ${esc(oname(a.office2))})</span>` : ""} · ${esc(a.hours)} hrs · starts ${esc(a.start || "flexible")}</p>
      <p class="mu">${esc(a.msg)}</p>
      <input id="n_${a.id}" placeholder="Note to applicant (e.g. report date, requirements)" value="${esc(a.note)}">
      <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
        ${STATUSES.slice(1).map(s => `<button class="btn s ${s === "Rejected" ? "r" : "o"}" onclick="setStatus('${a.id}','${s}')">${s}</button>`).join("")}
        <button class="btn s o" onclick="delApp('${a.id}')">Delete</button>
      </div></div>`).join("") || `<div class="card mu">No applications found.</div>`);
}

async function setStatus(id, status) {
  try { await api("/api/applications/" + id, "PATCH", {status, note: $("#n_" + id).value}); await go("admin"); }
  catch (e) { alert(e.message); }
}
async function delApp(id) {
  if (!confirm("Delete this application permanently?")) return;
  try { await api("/api/applications/" + id, "DELETE"); await go("admin"); }
  catch (e) { alert(e.message); }
}

/* ---------- settings ---------- */
function settingsView() {
  return `<div class="card login" style="margin:0"><h3>Change password</h3>
    <label>Current password<input id="cp" type="password"></label>
    <label>New password (min. 6 characters)<input id="np" type="password"></label>
    ${msg ? `<div class="msg">${esc(msg)}</div>` : ""}${okmsg ? `<div class="ok">${esc(okmsg)}</div>` : ""}
    <button class="btn" onclick="changePw()">Update password</button></div>`;
}
async function changePw() {
  msg = ""; okmsg = "";
  try { await api("/api/password", "POST", {current: $("#cp").value, next: $("#np").value}); okmsg = "✅ Password updated."; }
  catch (e) { msg = e.message; }
  render();
}

init();
</script>
</body>
</html>
